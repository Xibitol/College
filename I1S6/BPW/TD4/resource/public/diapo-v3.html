<!DOCTYPE html>
<html lang="fr">

  <head>
    <title> Troisième diaporama</title>
    <meta charset="UTF-8" />

    <link href="style/style-diapo.css" type="text/css" rel="stylesheet" />

		<!-- chargement du script -->
	<script src="scripts/tabImages.js"></script>
	<script src="scripts/diapov3.js"></script>

	<style>
		img{
			transition: opacity 1s ease-in-out;
		}
		.attenue{
			opacity: 0;
		}
	</style>
  </head>
  <body>
	<div class="diaporama">
		<img src="images/image.jpg" alt="un diaporama" id="diapo"/>
		<p><em id="filename"></em></p>
		<p><span id="index"></span>/<span id="total"></span></p>
	</div>
	<div>
		<label for="delay">Délai (en secondes):</label>
		<input id="delay" type="number" min="1" value="2">
		<button id="play">▶</button>
	</div>
  </body>
</html>
