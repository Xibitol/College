<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Graduate School Search</title>
	<link rel="shortcut icon" href="favicon.png" type="image/png">
	<link rel="stylesheet" href="/css/page.css">
	<script src="/js/gestionFormulaire.js" defer></script>
	<script src="js/tableAnims.js" defer></script>

<body>
	<main>
		<h1>Graduate school<br>research</h1>

		<p id="warning">
			Cette page n'est pas adaptée aux appareils mobiles (Téléphone, Tablette). Veuillez utiliser un ordinateur.
		</p>

		<form class="formulairePourBDProf">
			<section id="simpleForm">
				<div class="inputWrapper">
					<select id="search" name="requete">
						<option selected disabled hidden>- Select a search ...</option>
						<option value="SELECT `Année`, `Rentrée universitaire`, `Commune`, `Type établissement`, `Secteur`, `Sexe`, `Effectif`, GREATEST(`Effectif DUT`, 0) AS `Effectif DUT`, GREATEST(`effectif Ingénieurs`, 0) AS `Effectif ingénieurs`, `donnees_diffusables` AS `Données diffusables`, `donnees_soumises_au_secret_stat` AS `Données soumises au secret stat` FROM ESR ORDER BY `Année`, `Type établissement`, `Sexe`">Everything</option>
						<option value="SELECT `uucr_id`, `Code académie`, `Code région`, `Code secteur`, `niveau_geo`, `geo_id`, `Regroupement`, `Code sexe`, `Diffusable`, `secret`, `Année`, `a des effectifs en DUT`, `a des effectifs en ingénieurs` FROM ESR ORDER BY `Année`, `Regroupement`, `Code sexe`">Every identifiers</option>
						<option value="SELECT * FROM ESR">Too much</option>

						<option disabled>--- Totals ---</option>
						<option value="SELECT `Année`, `Rentrée universitaire`, SUM(`Effectif`) AS 'Effectif', SUM(`Effectif DUT`) AS 'Effectif DUT', SUM(`effectif Ingénieurs`) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Année`">Total students per years</option>
						<option value="SELECT `Secteur`, SUM(`Effectif`) AS `Effectif`, SUM(`Effectif DUT`) AS 'Effectif DUT', SUM(`effectif Ingénieurs`) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Secteur`">Total students per institution sectors</option>
						<option value="SELECT `Type établissement`, `Commune`, SUM(`Effectif`) AS 'Effectif', SUM(`Effectif DUT`) AS 'Effectif DUT', SUM(`effectif Ingénieurs`) AS 'Effectif ingénieurs' FROM ESR GROUP BY `Type établissement`">Total students per institutions</option>
						<option value="SELECT `Sexe`, SUM(`Effectif`) AS 'Effectif', SUM(`Effectif DUT`) AS 'Effectif DUT', SUM(`effectif Ingénieurs`) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Sexe`">Total students per genders</option>

						<option disabled>--- Averages ---</option>
						<option value="SELECT `Année`, `Rentrée universitaire`, ROUND(AVG(`Effectif`)) AS `Effectif`, ROUND(AVG(`Effectif DUT`)) AS 'Effectif DUT', ROUND(AVG(`effectif Ingénieurs`)) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Année`">Average students per years</option>
						<option value="SELECT `Secteur`, ROUND(AVG(`Effectif`)) AS `Effectif`, ROUND(AVG(`Effectif DUT`)) AS 'Effectif DUT', ROUND(AVG(`effectif Ingénieurs`)) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Secteur`">Average students per institution sectors</option>
						<option value="SELECT `Type établissement`, `Commune`, ROUND(AVG(`Effectif`)) AS `Effectif`, ROUND(AVG(`Effectif DUT`)) AS 'Effectif DUT', ROUND(AVG(`effectif Ingénieurs`)) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Type établissement`">Average students per institutions</option>
						<option value="SELECT `Sexe`, ROUND(AVG(`Effectif`)) AS `Effectif`, ROUND(AVG(`Effectif DUT`)) AS 'Effectif DUT', ROUND(AVG(`effectif Ingénieurs`)) AS 'Effectif ingénieurs' FROM ESR WHERE `Type établissement`!='Total des formations d\'enseignement supérieur' GROUP BY `Sexe`">Average students per genders</option>

						<option disabled>--- Institutions ---</option>
						<option value="SELECT `Type établissement`, `Secteur`, `Commune`, SUM(`Effectif`) AS 'Effectif', SUM(`Effectif DUT`) AS 'Effectif DUT' FROM ESR WHERE `a des effectifs en DUT`='oui' GROUP BY `Type établissement`, `Secteur`">Institutions with DUT students</option>
						<option value="SELECT `Type établissement`, `Secteur`, `Commune`, SUM(`Effectif`) AS 'Effectif', SUM(`effectif Ingénieurs`) AS 'Effectif ingénieurs' FROM ESR WHERE `a des effectifs en ingénieurs`='oui' GROUP BY `Type établissement`, `Secteur`">Institutions with engineers students</option>
						<option value="SELECT `Type établissement`, `Secteur`, `Commune`, SUM(`Effectif`) AS 'Effectif' FROM ESR WHERE `a des effectifs en DUT`='non' AND `a des effectifs en ingénieurs`='non' GROUP BY `Type établissement`, `Secteur`">Other institutions</option>
						<option value="SELECT * FROM ESR WHERE `Code sexe`='1'">dsqjdhkqsdgs</option>
					</select>
					<label for="search">Que cherchez-vous ?</label>
				</div>

				<input type="submit" value="search">
			</section>

			<section id="advancedForm">

			</section>
		</form>
		<a id="advanced" href="/?mode=advanced">Mode avancé</a>

		</section>
